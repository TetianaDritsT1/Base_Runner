<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Runner: Кибернетический Тоннель</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0052FF 0%, #0d0d0d 100%);
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            user-select: none;
            overflow: hidden;
        }
        canvas {
            background: #111116;
            border: 2px solid rgba(0, 82, 255, 0.5);
            box-shadow: 0 25px 50px rgba(0, 82, 255, 0.25);
            border-radius: 1rem;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Верхняя панель управления и статистики -->
    <div class="w-full max-w-xl flex justify-between items-center mb-4 bg-gray-900/90 border border-blue-500/30 p-4 rounded-2xl backdrop-blur-md shadow-lg">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">🔵</span>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-white">Base Runner L2</h1>
                <p class="text-xs text-blue-300 font-mono">Пройдите мемпул без ошибок</p>
            </div>
        </div>
        <div class="text-right flex space-x-4">
            <div class="text-sm font-mono text-blue-400">Очки: <span id="score" class="font-bold text-white">0</span></div>
            <div class="text-sm font-mono text-red-400">Жизни: <span id="lives" class="font-bold text-white">3</span></div>
        </div>
    </div>

    <!-- Игровой контейнер -->
    <div class="relative">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
        
        <!-- Меню (Старт / Конец игры) -->
        <div id="menuOverlay" class="absolute inset-0 bg-black/85 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-6 text-center">
            <h2 id="menuTitle" class="text-3xl font-bold mb-2 text-blue-400">Запуск ноды Base</h2>
            <p id="menuDesc" class="text-sm text-gray-300 mb-6 max-w-xs leading-relaxed">
                Управляйте платформой стрелками <b>←</b> и <b>→</b> (или клавишами A/D). Ловите зелёные блоки газа и фиолетовые кристаллы, избегайте красных багов!
            </p>
            <button onclick="startGame()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-3 rounded-xl shadow-lg shadow-blue-500/40 transition transform hover:scale-105">
                Старт игры 🚀
            </button>
        </div>
    </div>

    <!-- Подсказка по управлению -->
    <div class="mt-4 text-xs font-mono text-blue-300/80 bg-gray-900/60 px-4 py-2 rounded-xl border border-blue-500/20">
        💡 Управление: Стрелки влево / вправо
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let animationId;

        // Платформа игрока
        let player = {
            x: canvas.width / 2 - 40,
            y: canvas.height - 40,
            width: 80,
            height: 16,
            speed: 8,
            dx: 0
        };

        // Падающие объекты (блоки газа, кристаллы, баги)
        let objects = [];

        let keys = { ArrowLeft: false, ArrowRight: false, KeyA: false, KeyD: false };

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.ArrowRight = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.ArrowRight = false;
        });

        function startGame() {
            score = 0;
            lives = 3;
            objects = [];
            player.x = canvas.width / 2 - 40;
            gameRunning = true;
            document.getElementById('menuOverlay').classList.add('hidden');
            updateUI();
            if (animationId) cancelAnimationFrame(animationId);
            loop();
        }

        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            const overlay = document.getElementById('menuOverlay');
            document.getElementById('menuTitle').textContent = "Мемпул переполнен! 💥";
            document.getElementById('menuDesc').textContent = `Сеть столкнулась с багами. Ваш итоговый счёт: ${score} очков.`;
            overlay.classList.remove('hidden');
        }

        function spawnObject() {
            if (Math.random() < 0.035) {
                const rand = Math.random();
                let type = 'gas'; // 🟢 Зеленый газ (полезно)
                let color = '#10B981';
                let points = 1;

                if (rand > 0.6 && rand <= 0.85) {
                    type = 'crystal'; // 🟣 Кристалл Base (много очков)
                    color = '#0052FF';
                    points = 3;
                } else if (rand > 0.85) {
                    type = 'bug'; // 🔴 Баг (отнимает жизнь)
                    color = '#EF4444';
                    points = 0;
                }

                objects.push({
                    x: Math.random() * (canvas.width - 25),
                    y: -30,
                    size: 24,
                    speed: 3 + Math.random() * 2.5,
                    type: type,
                    color: color,
                    points: points
                });
            }
        }

        function update() {
            // Движение платформы
            if ((keys.ArrowLeft || keys.KeyA) && player.x > 0) {
                player.x -= player.speed;
            }
            if ((keys.ArrowRight || keys.KeyD) && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            spawnObject();

            // Обновление позиций падающих элементов
            for (let i = objects.length - 1; i >= 0; i--) {
                let obj = objects[i];
                obj.y += obj.speed;

                // Проверка столкновения с платформой игрока
                if (
                    obj.x < player.x + player.width &&
                    obj.x + obj.size > player.x &&
                    obj.y < player.y + player.height &&
                    obj.y + obj.size > player.y
                ) {
                    if (obj.type === 'bug') {
                        lives -= 1;
                        if (lives <= 0) {
                            gameOver();
                            return;
                        }
                    } else {
                        score += obj.points;
                    }
                    objects.splice(i, 1);
                    continue;
                }

                // Удаление объектов, упавших ниже экрана
                if (obj.y > canvas.height) {
                    if (obj.type !== 'bug') {
                        // Если упустили полезный блок, можно забрать очко или проигнорировать
                    }
                    objects.splice(i, 1);
                }
            }
            updateUI();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Отрисовка платформы игрока (Base Builder Node)
            ctx.fillStyle = '#0052FF';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#0052FF';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowBlur = 0; // Сбрасываем тени

            // Отрисовка элементов
            objects.forEach(obj => {
                ctx.save();
                ctx.fillStyle = obj.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = obj.color;
                
                if (obj.type === 'crystal') {
                    // Рисуем кристалл (ромб)
                    ctx.beginPath();
                    ctx.moveTo(obj.x + obj.size / 2, obj.y);
                    ctx.lineTo(obj.x + obj.size, obj.y + obj.size / 2);
                    ctx.lineTo(obj.x + obj.size / 2, obj.y + obj.size);
                    ctx.lineTo(obj.x, obj.y + obj.size / 2);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    // Рисуем квадрат для газа и багов
                    ctx.fillRect(obj.x, obj.y, obj.size, obj.size);
                }
                ctx.restore();
            });
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
        }

        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            animationId = requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
